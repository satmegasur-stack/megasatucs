<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nos hemos mudado</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --yellow: #ffc800;
    --black: #1a1a1a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100%;
    background: var(--black);
    color: var(--yellow);
    font-family: "Arial Black", Impact, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  .stripe {
    height: 36px;
    flex: none;
    background: repeating-linear-gradient(-45deg, var(--yellow) 0 24px, var(--black) 24px 48px);
  }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    gap: 20px;
  }
  .cone { font-size: 64px; line-height: 1; animation: bob 2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px); } }
  h1 {
    margin: 0;
    font-size: clamp(2.2rem, 9vw, 5rem);
    text-transform: uppercase;
    letter-spacing: 2px;
    background: var(--yellow);
    color: var(--black);
    padding: 10px 24px;
    border: 4px solid var(--black);
    outline: 4px solid var(--yellow);
    transform: rotate(-2deg);
  }
  p { margin: 0; font-family: Arial, sans-serif; font-size: 1.1rem; color: #f2f2f2; }
  a {
    display: inline-block;
    max-width: 100%;
    overflow-wrap: anywhere;
    font-family: "Courier New", monospace;
    font-weight: bold;
    font-size: clamp(1rem, 3.5vw, 1.4rem);
    color: var(--black);
    background: var(--yellow);
    padding: 12px 18px;
    text-decoration: none;
    border-radius: 4px;
    border: 3px dashed var(--black);
    outline: 3px solid var(--yellow);
  }
  a:hover { background: #fff; }
  .small { font-size: .9rem; color: var(--yellow); letter-spacing: 1px; text-transform: uppercase; font-family: Arial, sans-serif; }
</style>
</head>
<body>
  <div class="stripe"></div>
  <main>
    <div class="cone">🚧</div>
    <h1>Nos hemos mudado</h1>
    <p>Nuestra nueva dirección web es:</p>
    <a href="https://a72786990-spec.github.io/portatilsat20/">https://a72786990-spec.github.io/portatilsat20/</a>
    <div class="small">🚧 Página en obras · Disculpen las molestias 🚧</div>
  </main>
  <div class="stripe"></div>
</body>
</html>
